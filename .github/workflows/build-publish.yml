# This workflow will build and (if release) publish Python distributions to PyPI
# For more information see:
#   - https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
#   - https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
#   - Adapted from https://github.com/Farama-Foundation/PettingZoo/blob/e230f4d80a5df3baf9bd905149f6d4e8ce22be31/.github/workflows/build-publish.yml

name: build-publish

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          # Configure cibuildwheel to build native archs, and some emulated ones
          CIBW_ARCHS_LINUX: x86_64 # aarch64 - disable ARM, as it's not working for a moment
          #CIBW_ARCHS_MACOS: x86_64 arm64 - macos is disabled for a moment
          CIBW_BUILD_VERBOSITY: 3  # Increase verbosity to see what's going on
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >  # Print additional info from auditwheel
            auditwheel show {wheel} && auditwheel repair -w {dest_dir} {wheel}

      - name: Report built wheels
        run: |
          ls -l ./wheelhouse/*.whl

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_integration_linux:
    name: Build Linux integration AppImage
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
    runs-on: ubuntu-20.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            zlib1g-dev \
            libzip-dev \
            qtbase5-dev \
            qttools5-dev-tools \
            patchelf \
            desktop-file-utils

      - name: Configure integration build
        run: |
          cmake -S . -B build-integration \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_UI=ON \
            -DBUILD_PYTHON=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_N64=OFF

      - name: Build integration binary
        run: |
          cmake --build build-integration --target gym-retro-integration -j"$(nproc)"

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/bin/stable_retro/cores
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp build-integration/gym-retro-integration AppDir/usr/bin/
          cp build-integration/stable_retro/cores/*_libretro.so AppDir/usr/bin/stable_retro/cores/
          cp build-integration/stable_retro/cores/*.json AppDir/usr/bin/stable_retro/cores/
          cp src/ui/logo.ico AppDir/usr/share/icons/hicolor/256x256/apps/stable-retro-integration.ico

          cat > AppDir/usr/share/applications/stable-retro-integration.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Gym Retro Integration
          Exec=gym-retro-integration
          Icon=stable-retro-integration
          Categories=Development;
          Terminal=false
          EOF

      - name: Build AppImage
        env:
          QMAKE: /usr/lib/qt5/bin/qmake
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          export PATH="$PWD:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/stable-retro-integration.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/stable-retro-integration.ico \
            --executable AppDir/usr/bin/gym-retro-integration \
            --plugin qt \
            --output appimage

      - name: Rename AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APPIMAGE_PATH="$(ls -1 ./*.AppImage | head -n 1)"
          mv "$APPIMAGE_PATH" "stable-retro-integration-${VERSION}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: integration-appimage
          path: stable-retro-integration-*-x86_64.AppImage

      - name: Attach AppImage to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: stable-retro-integration-*-x86_64.AppImage

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download wheels Ubuntu
        uses: actions/download-artifact@v7
        with:
          name: wheels-ubuntu-22.04
          path: dist

      - name: Download wheels macOS
        uses: actions/download-artifact@v7
        with:
          name: wheels-macos-14
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        # To test:
        # with:
        #   repository_url: https://test.pypi.org/legacy/
