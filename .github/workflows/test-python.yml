name: Test Stable-Retro

on: [pull_request, push]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ubuntu-latest  # todo, add more OS systems to see if they work as well
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake capnproto zlib1g-dev build-essential pkg-config libzip-dev software-properties-common libbz2-dev xvfb python3-opengl libglu1-mesa-dev

      - name: Install pip packages
        run: |
          python3 -m pip install --upgrade "pip<26.2"
          python3 -m pip install -e '.[dev]'

      - name: Run tests
        run: scripts/test-python.sh
        env:
          STABLE_RETRO_TEST_RENDERING: '1'

  macos-arm64:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            python-version: '3.11'
          - os: macos-26
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify native Apple Silicon Python
        run: python -c "import platform; assert platform.machine() == 'arm64'"

      - name: Build with bundled native dependencies
        run: |
          python -m pip install --upgrade "pip<26.2"
          python -m pip install -e '.[dev]'
        env:
          # Exercise the libzip fallback used by macOS wheels as well.
          CMAKE_ARGS: -DPKG_CONFIG_EXECUTABLE=/usr/bin/false -DCMAKE_DISABLE_FIND_PACKAGE_CapnProto=TRUE

      - name: Test emulation, serialization, and window rendering
        run: python -m pytest tests/test_python
        env:
          STABLE_RETRO_TEST_RENDERING: '1'

      - name: Test native cores and host byte order
        run: scripts/test-cpp.sh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
